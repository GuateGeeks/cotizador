name: Deploy asesor de programas educativos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test and build the 3D campus bundle
        # Nothing is published unless the quotation engine and campus rules pass.
        run: |
          npm ci
          npm test
          npm run build
      - name: Prepare the site (asesor de programas educativos)
        run: |
          mkdir -p _site
          cp asesor/index.html asesor/asesor.css asesor/asesor.js asesor/campus-experience.js asesor/config.js asesor/motor.js asesor/pdf.js asesor/propuesta-pdf.js _site/
          cp -R asesor/vendor _site/vendor
          cp -R assets _site/assets
          # el asesor vive en la raíz del sitio: sus rutas ../assets pasan a assets
          sed -i.bak 's#\.\./assets/#assets/#g' _site/index.html _site/asesor.js _site/config.js
          rm -f _site/*.bak
          if grep -rn '\.\./' _site/*.html _site/*.js; then echo 'Quedaron rutas relativas fuera del sitio'; exit 1; fi
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
