name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (engine, prices, PDF, campus rules)
        run: npm test
      - name: Verify pinned Geeky client
        run: npm run check:agent
      - name: Build the 3D campus bundle
        run: npm run build
      - name: Committed bundle matches the sources
        run: git diff --exit-code -- asesor/vendor/lab-scene.min.js asesor/vendor/agent-character.mjs || (echo 'Run npm run build and commit generated campus and character bundles' && exit 1)
