aVu Sans,sans-serif" font-size="15" font-weight="400" fill="#6A577B">Superficies planas o abiertas se muestran por ambas caras en esta lámina. No se añade espesor ni geometría.</text><text x="40" y="1070" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#6A577B">Unidades H relativas a la altura completa · +Y arriba · +Z frente · +X izquierda anatómica · sin UV/texturas</text></svg>