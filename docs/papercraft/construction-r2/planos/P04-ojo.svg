nales</text><rect x="1207" y="540" width="380" height="416" rx="14" fill="#EEE7F5"/><text x="1225" y="570" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#321853">DATOS DE MONTAJE</text><text x="1225" y="605" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Vértices: 4</text><text x="1225" y="634" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Triángulos por pieza: 2</text><text x="1225" y="663" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Tipo: aplique plano</text><text x="1225" y="692" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Ancho X: 0.01200 H</text><text x="1225" y="721" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Alto Y: 0.01800 H</text><text x="1225" y="750" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Profundidad Z: 0.00195 H</text><text x="1225" y="779" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Escala final: H = 0.78</text><text x="1225" y="808" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">L/R = lados del personaje</text><text x="1225" y="845" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#321853">Origen y vértices: datos/P04</text><text x="1225" y="871" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#321853">Transformación: datos/assembly.json</text><text x="40" y="1004" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#321853">Los PNG artísticos orientan el acabado; estos planos y los JSON definen la malla de apoyo.</text><text x="40" y="1037" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#6A577B">Superficies planas o abiertas se muestran por ambas caras en esta lámina. No se añade espesor ni geometría.</text><text x="40" y="1070" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#6A577B">Unidades H relativas a la altura completa · +Y arriba · +Z frente · +X izquierda anatómica · sin UV/texturas</text></svg>