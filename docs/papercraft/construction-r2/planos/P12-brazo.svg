4500 H</text><text x="1225" y="779" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">Escala final: H = 0.78</text><text x="1225" y="808" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#321853">L/R = lados del personaje</text><text x="1225" y="845" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#321853">Origen y vértices: datos/P12</text><text x="1225" y="871" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#321853">Transformación: datos/assembly.json</text><text x="40" y="1004" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#321853">Los PNG artísticos orientan el acabado; estos planos y los JSON definen la malla de apoyo.</text><text x="40" y="1037" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#6A577B">Superficies planas o abiertas se muestran por ambas caras en esta lámina. No se añade espesor ni geometría.</text><text x="40" y="1070" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#6A577B">Unidades H relativas a la altura completa · +Y arriba · +Z frente · +X izquierda anatómica · sin UV/texturas</text></svg>